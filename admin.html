<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders | Brown's Coffee</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html"
        ><span class="brand-mark">BC</span> Brown's Coffee</a
      >
      <nav class="nav">
        <a href="index.html">View site</a><a href="login.html">Sign out</a>
      </nav>
    </header>
    <main class="page-main">
      <span class="eyebrow">Counter dashboard / Tuesday</span>
      <h1 class="page-title">Today's orders.</h1>
      <section class="admin-panel">
        <div class="admin-panel-head">
          <div>
            <span class="eyebrow">Menu management</span>
            <h2>Add a new menu item</h2>
          </div>
          <p class="admin-message" data-admin-message></p>
        </div>
        <form class="admin-form" id="menu-item-form">
          <label>
            Coffee name
            <input name="name" type="text" placeholder="Cinnamon cortado" required />
          </label>
          <label>
            Description
            <input name="description" type="text" placeholder="Espresso, cinnamon, and silky milk" required />
          </label>
          <label>
            Price
            <input name="price" type="number" min="0.01" step="0.01" placeholder="5.50" required />
          </label>
          <label>
            Category
            <select name="category">
              <option value="coffee">Coffee</option>
              <option value="food">Food</option>
            </select>
          </label>
          <button class="button" type="submit">Add to menu</button>
        </form>
      </section>

      <section class="admin-panel">
        <div class="admin-panel-head">
          <div>
            <span class="eyebrow">Coffee menu</span>
            <h2>Available coffee types</h2>
          </div>
          <p class="admin-message" data-coffee-message></p>
        </div>

        <div id="coffee-types-list" class="coffee-list" aria-live="polite">
          <p class="empty-state">Loading coffee types...</p>
        </div>
      </section>

      <section class="admin-orders">
        <div class="admin-section-head">
          <div>
            <span class="eyebrow">Live queue</span>
            <h2>Incoming orders</h2>
          </div>
          <p class="admin-message" data-orders-message></p>
        </div>
        <table class="admin-table">
        <thead>
          <tr>
            <th>Order</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Total</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="orders-body">
          <tr><td colspan="5">Loading orders...</td></tr>
        </tbody>
        </table>
      </section>
    </main>
    <script type="module" src="JS/admin.js"></script>
    <script type="module" src="JS/menu.js"></script>
  </body>
</html>
